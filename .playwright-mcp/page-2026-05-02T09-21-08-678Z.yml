  - main [ref=e12]:
    - generic [ref=e13]:
      - paragraph [ref=e14]: Methodology
      - heading "How NeutralEye reads an article." [level=1] [ref=e15]
      - paragraph [ref=e16]: NeutralEye evaluates tone, framing, sourcing, and omission to estimate whether a piece of writing is pushing the reader toward a particular interpretation.
    - generic [ref=e17]:
      - generic [ref=e18]:
        - heading "Bias is read from the writing, not assigned from a publisher label." [level=2] [ref=e19]
        - paragraph [ref=e20]: The methodology is built to keep the analysis inspectable, structured, and restrained. It describes how the article is written, not who is allowed to write it.
      - generic [ref=e21]:
        - article [ref=e22]:
          - heading "Signals stay visible" [level=3] [ref=e23]
          - paragraph [ref=e24]: Tone, framing, sourcing, and omission are reviewed as named writing patterns rather than collapsed into one opaque score.
          - list [ref=e25]:
            - listitem [ref=e26]: Tone checks for emotional loading and overstated certainty.
            - listitem [ref=e27]: Framing checks what the article centers, backgrounds, or repeatedly emphasizes.
            - listitem [ref=e28]: Omission checks whether missing context could materially change the read.
        - article [ref=e29]:
          - heading "Evidence stays attached" [level=3] [ref=e30]
          - paragraph [ref=e31]: Outputs point back to quoted language, source balance, and narrative choices so the result can be inspected rather than simply accepted.
          - list [ref=e32]:
            - listitem [ref=e33]: Quoted examples remain part of the explanation.
            - listitem [ref=e34]: Attribution clarity and source mix are reviewed together.
            - listitem [ref=e35]: Recommended next reads are used to add context, not close the inquiry.
        - article [ref=e36]:
          - heading "Confidence stays separate" [level=3] [ref=e37]
          - paragraph [ref=e38]: Analysis confidence reflects how consistently the same signals repeat across the text. It is not a factual verdict about the article.
          - list [ref=e39]:
            - listitem [ref=e40]: High confidence usually means the same signal pattern repeats.
            - listitem [ref=e41]: Low confidence can mean the writing is mixed, short, or ambiguous.
            - listitem [ref=e42]: Confidence does not certify that a viewpoint is true or false.
    - generic [ref=e43]:
      - generic [ref=e44]:
        - heading "The output is meant to support judgment, not replace it." [level=2] [ref=e45]
        - paragraph [ref=e46]: "NeutralEye works best when the result is read as an analytical aid: summary first, evidence second, and wider context whenever the story feels incomplete."
      - generic [ref=e47]:
        - article [ref=e48]:
          - heading "Start with the summary" [level=3] [ref=e49]
          - paragraph [ref=e50]: Read the top-level explanation first, then use the supporting sections to see what language and sourcing patterns shaped the result.
        - article [ref=e51]:
          - heading "Use examples as evidence" [level=3] [ref=e52]
          - paragraph [ref=e53]: Examples of bias are meant to show the exact phrases or structures that triggered concern, not to act as isolated proof by themselves.
        - article [ref=e54]:
          - heading "Treat recommendations as context prompts" [level=3] [ref=e55]
          - paragraph [ref=e56]: When the system suggests more reading, it is pointing to missing comparison context rather than claiming the question is settled.
    - generic [ref=e57]:
      - heading "Where the system needs reader discipline." [level=2] [ref=e59]
      - generic [ref=e60]:
        - article [ref=e61]:
          - heading "Short or messy input" [level=3] [ref=e62]
          - paragraph [ref=e63]: Very short passages, extraction failures, heavy navigation text, or blocked pages can weaken the quality of the analysis.
        - article [ref=e64]:
          - heading "Rhetorical edge cases" [level=3] [ref=e65]
          - paragraph [ref=e66]: Satire, irony, or unusually stylized writing can resemble bias signals even when the intent of the piece is different.
        - article [ref=e67]:
          - heading "Scope of the result" [level=3] [ref=e68]
          - paragraph [ref=e69]: The result reflects the writing patterns visible in the submitted text. It is not a universal judgment on the outlet, author, or topic.
        - article [ref=e70]:
          - heading "Reader judgment remains necessary" [level=3] [ref=e71]
          - paragraph [ref=e72]: NeutralEye is strongest when it helps a reader slow down, inspect the evidence, and compare context before forming a conclusion.
    - generic [ref=e73]:
      - generic [ref=e74]:
        - heading "Every result is meant to stay explainable." [level=2] [ref=e75]
        - paragraph [ref=e76]: The output is designed to make readers inspect the article more carefully, not to turn the analysis into a black box verdict.
      - generic [ref=e77]:
        - article [ref=e78]:
          - heading "Examples of bias" [level=3] [ref=e79]
          - paragraph [ref=e80]: Quoted language and framing examples are surfaced so readers can inspect the rationale behind the result.
        - article [ref=e81]:
          - heading "Suggested sources" [level=3] [ref=e82]
          - paragraph [ref=e83]: Comparison ideas and next-reading prompts help the reader widen context when the article feels one-sided or incomplete.

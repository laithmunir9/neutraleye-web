        - generic [ref=e27]:
          - generic [ref=e28]:
            - heading "Tone shapes interpretation" [level=2] [ref=e29]
            - paragraph [ref=e30]: Two articles can cover the same facts but lead readers in different directions through adjectives, verbs, and the order in which claims appear.
            - paragraph [ref=e31]: A report that says a group "claimed" something creates a different feeling than one that says the group "explained" it. A headline that foregrounds conflict will prepare the reader differently than one that foregrounds consequence or uncertainty.
            - paragraph [ref=e32]: NeutralEye treats tone as a signal, not a verdict. The point is to notice when wording is doing interpretive work that a reader might otherwise absorb without pausing.
          - generic [ref=e33]:
            - heading "Framing changes the center of gravity" [level=2] [ref=e34]
            - paragraph [ref=e35]: When one article treats an event as a policy success and another treats it as institutional failure, readers are not only learning facts. They are inheriting a narrative frame.
            - paragraph [ref=e36]: Framing often appears through structure. Which detail arrives first? Which actor gets motive? Which consequence gets explained, and which one is left as a passing mention?
            - paragraph [ref=e37]: That structure matters because most readers do not evaluate every sentence independently. They build a mental model as the story unfolds, and early framing can shape how later details are interpreted.
          - generic [ref=e38]:
            - heading "Omission matters too" [level=2] [ref=e39]
            - paragraph [ref=e40]: Missing context can be just as influential as explicit persuasion. A reader may never see the tradeoffs, background, or alternate interpretation needed for a fair assessment.
            - paragraph [ref=e41]: Omission is difficult because it is invisible inside a single article. A piece can feel complete while leaving out the strongest counterargument, the relevant history, or a source who would complicate the main claim.
            - paragraph [ref=e42]: This is why NeutralEye separates evidence from confidence. It can point to visible signals in the text, but it should also remind readers where comparison reading may be necessary.

            - generic [ref=e26]:
              - heading "Tone shapes interpretation" [level=2] [ref=e27]
              - paragraph [ref=e28]: Two articles can cover the same facts but lead readers in different directions through adjectives, verbs, and the order in which claims appear.
              - paragraph [ref=e29]: A report that says a group "claimed" something creates a different feeling than one that says the group "explained" it. A headline that foregrounds conflict will prepare the reader differently than one that foregrounds consequence or uncertainty.
              - paragraph [ref=e30]: NeutralEye treats tone as a signal, not a verdict. The point is to notice when wording is doing interpretive work that a reader might otherwise absorb without pausing.
            - generic [ref=e31]:
              - heading "Framing changes the center of gravity" [level=2] [ref=e32]
              - paragraph [ref=e33]: When one article treats an event as a policy success and another treats it as institutional failure, readers are not only learning facts. They are inheriting a narrative frame.
              - paragraph [ref=e34]: Framing often appears through structure. Which detail arrives first? Which actor gets motive? Which consequence gets explained, and which one is left as a passing mention?
              - paragraph [ref=e35]: That structure matters because most readers do not evaluate every sentence independently. They build a mental model as the story unfolds, and early framing can shape how later details are interpreted.
            - generic [ref=e36]:
              - heading "Omission matters too" [level=2] [ref=e37]
              - paragraph [ref=e38]: Missing context can be just as influential as explicit persuasion. A reader may never see the tradeoffs, background, or alternate interpretation needed for a fair assessment.
              - paragraph [ref=e39]: Omission is difficult because it is invisible inside a single article. A piece can feel complete while leaving out the strongest counterargument, the relevant history, or a source who would complicate the main claim.
              - paragraph [ref=e40]: This is why NeutralEye separates evidence from confidence. It can point to visible signals in the text, but it should also remind readers where comparison reading may be necessary.
